name: Auto Release on Version Bump

# Publishes a GitHub Release automatically whenever `versionName` in
# app/build.gradle.kts changes on `main` and Android CI has passed for that
# commit - no manual tag push required.
#
# Why this exists: pushing a tag (`git push origin vX.Y.Z`) from this AI
# agent's own session credentials was confirmed to fail with HTTP 403 (see
# CLAUDE.md section 6), even though ordinary branch pushes work fine. A
# GitHub Actions job's built-in GITHUB_TOKEN is a separate credential from
# that session token and is NOT subject to the same restriction, so tagging
# is done here, by the workflow itself, once CI has already verified the
# commit. This uses no paid service and needs no extra secret or PAT - it
# only needs `permissions: contents: write`, already granted below.
#
# To cut a release: bump `versionName` (and usually `versionCode`) in
# app/build.gradle.kts and get that commit onto `main` as usual (direct
# push or merged PR). Nothing else to do - once Android CI is green for
# that commit, this workflow tags it and publishes the release.
#
# A plain `git push origin vX.Y.Z` from a human's own machine still works
# too and independently triggers release.yml's own `push: tags:` trigger -
# both paths are kept so neither depends on the other.

on:
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-version:
    name: Check for a version bump
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.check.outputs.tag_name }}
      sha: ${{ steps.resolve_sha.outputs.sha }}
    steps:
      - name: Resolve commit SHA to check
        id: resolve_sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_sha.outputs.sha }}

      - name: Compare versionName against existing tags
        id: check
        run: |
          VERSION_NAME=$(grep -oP '(?<=versionName = ")[^"]+' app/build.gradle.kts || true)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"
            exit 1
          fi

          TAG="v${VERSION_NAME}"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"

          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag ${TAG} already exists - versionName was not bumped, skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version detected: ${TAG} (no existing tag on origin)."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Tag and publish release
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-version.outputs.sha }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push release tag
        env:
          TAG: ${{ needs.check-version.outputs.tag_name }}
        run: |
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Same optional-signing pattern as release.yml: real signing only when
      # RELEASE_KEYSTORE_BASE64 etc. are configured, otherwise app/build.gradle.kts
      # falls back to the auto-generated debug keystore. See CLAUDE.md 4.2.
      - name: Decode release keystore (if configured)
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Determine signing status
        id: signing
        run: |
          if [ -n "${{ steps.keystore.outputs.path }}" ]; then
            echo "note=Signed with the repository's configured release keystore." >> "$GITHUB_OUTPUT"
          else
            echo "note=⚠️ No release keystore secrets were configured (RELEASE_KEYSTORE_BASE64 etc.), so this APK is signed with the auto-generated Android debug key. It is installable for testing but must NOT be distributed via the Play Store or treated as a production release. See CLAUDE.md for how to add real signing secrets." >> "$GITHUB_OUTPUT"
          fi

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag_name }}
          target_commitish: ${{ needs.check-version.outputs.sha }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            Automatically tagged and published by CI: the Android CI workflow
            (unit tests, debug build, and emulator UI tests) passed for this
            commit on `main`, and `versionName` in app/build.gradle.kts had
            been bumped to a version with no existing tag, so this workflow
            created the `${{ needs.check-version.outputs.tag_name }}` tag and
            built this release itself - no manual tag push was needed.

            ${{ steps.signing.outputs.note }}
