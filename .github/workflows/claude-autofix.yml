name: Claude Auto-fix CI Failures

# ⚠️ SECURITY NOTE
#
# This workflow checks out the PR branch and runs Gradle build/test commands
# against it with elevated permissions (contents: write, pull-requests: write).
# Code from the PR branch executes in a trusted context with access to
# secrets and the ability to push a new branch/PR to this repository.
#
# Only enable this in repositories where everyone with write access is fully
# trusted with these permissions. The pull_requests[0] check below limits
# this to same-repo PRs (fork PRs are excluded), but anyone who can push a
# branch to this repository can influence what runs here.
#
# ⚠️ COST NOTE
#
# This workflow calls the Anthropic API and is billed per token. It only
# runs when the ANTHROPIC_API_KEY secret is set, so it is fully opt-in and
# does nothing until that secret is added. See CLAUDE.md for setup steps.

on:
  workflow_run:
    workflows: ["Android CI"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write

jobs:
  auto-fix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.pull_requests[0] &&
      !startsWith(github.event.workflow_run.head_branch, 'claude-auto-fix-ci-') &&
      vars.ENABLE_CLAUDE_AUTOFIX == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup git identity
        run: |
          git config --global user.email "claude[bot]@users.noreply.github.com"
          git config --global user.name "claude[bot]"

      - name: Create fix branch
        id: branch
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SAFE_BRANCH=$(printf '%s' "$HEAD_BRANCH" | tr -cd 'a-zA-Z0-9/_.-')
          BRANCH_NAME="claude-auto-fix-ci-${SAFE_BRANCH}-${RUN_ID}"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Get CI failure details
        id: failure_details
        uses: actions/github-script@v7
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ github.event.workflow_run.id }}
            });

            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ github.event.workflow_run.id }}
            });

            const failedJobs = jobs.data.jobs.filter(job => job.conclusion === 'failure');

            let errorLogs = [];
            for (const job of failedJobs) {
              const logs = await github.rest.actions.downloadJobLogsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                job_id: job.id
              });
              // Keep only the tail of each log to stay well under prompt limits.
              const text = typeof logs.data === "string" ? logs.data : String(logs.data);
              errorLogs.push({
                jobName: job.name,
                logs: text.slice(-20000)
              });
            }

            return {
              runUrl: run.data.html_url,
              failedJobs: failedJobs.map(j => j.name),
              errorLogs: errorLogs
            };

      - name: Fix CI failures with Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            The "Android CI" GitHub Actions workflow failed for this branch.

            Failed CI run: ${{ fromJSON(steps.failure_details.outputs.result).runUrl }}
            Failed jobs: ${{ join(fromJSON(steps.failure_details.outputs.result).failedJobs, ', ') }}
            Pull request: #${{ github.event.workflow_run.pull_requests[0].number }}
            Fix branch (already checked out): ${{ steps.branch.outputs.branch_name }}
            Base branch: ${{ github.event.workflow_run.head_branch }}
            Repository: ${{ github.repository }}

            This is a Kotlin + Jetpack Compose Android app built with Gradle
            (./gradlew). The failure logs from each failed job are below.

            Investigate the root cause and fix it in the source code (only touch
            the GitHub Actions workflow files if the workflow configuration
            itself is broken, e.g. a typo or a missing input). Prefer minimal,
            targeted changes. Re-run the relevant Gradle task(s) locally
            (e.g. `./gradlew testDebugUnitTest`, `./gradlew assembleDebug`) to
            confirm the fix before committing, when the sandbox allows it.

            When you have a fix, commit it on the current branch
            (${{ steps.branch.outputs.branch_name }}), push it, and open a pull
            request against ${{ github.event.workflow_run.head_branch }}
            describing what was wrong and what you changed.

            If you cannot determine or safely fix the cause, do not guess:
            open a pull request or leave a clear comment on PR
            #${{ github.event.workflow_run.pull_requests[0].number }} explaining
            what you found, which parts you ruled out, and what a human should
            look at next.

            Error logs (may be truncated to the last portion of each job's log):
            ${{ toJSON(fromJSON(steps.failure_details.outputs.result).errorLogs) }}
          claude_args: "--allowedTools 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(./gradlew:*),Bash(gh:*)' --max-turns 30"
