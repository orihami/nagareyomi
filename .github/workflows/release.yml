name: Release

# Builds and publishes a verified APK to GitHub Releases whenever a version
# tag (vX.Y.Z) is pushed. The release only happens after the full Android CI
# workflow (unit tests + build + emulator UI tests) passes for that commit.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify (CI)
    uses: ./.github/workflows/android-ci.yml

  release:
    name: Build & publish release APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # If real signing secrets are configured, decode the keystore and sign
      # a genuine release build. Otherwise app/build.gradle.kts falls back to
      # signing with the auto-generated debug keystore so the APK is still
      # installable, and the release notes below say so explicitly.
      #
      # Note: the `secrets` context cannot be referenced directly inside a
      # step's `if:` condition, so the secret is passed in via `env:` and the
      # presence check is done in the shell script instead.
      - name: Decode release keystore (if configured)
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Determine signing status
        id: signing
        run: |
          if [ -n "${{ steps.keystore.outputs.path }}" ]; then
            echo "note=Signed with the repository's configured release keystore." >> "$GITHUB_OUTPUT"
          else
            echo "note=⚠️ No release keystore secrets were configured (RELEASE_KEYSTORE_BASE64 etc.), so this APK is signed with the auto-generated Android debug key. It is installable for testing but must NOT be distributed via the Play Store or treated as a production release. See CLAUDE.md for how to add real signing secrets." >> "$GITHUB_OUTPUT"
          fi

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No release APK was produced." >&2
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            Automatically built and verified by the Android CI workflow (unit tests,
            debug build, and emulator UI tests all passed for this commit) before
            being published here.

            ${{ steps.signing.outputs.note }}
